name: Build debug APK

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, codex/roadmap-student-os ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # adds a manual "Run workflow" button too

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # This repo's zip doesn't include gradlew/gradlew.bat/gradle-wrapper.jar,
      # so this installs Gradle 8.13 directly (matching gradle-wrapper.properties)
      # instead of relying on ./gradlew.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Unit tests and debug APK
        run: gradle clean testDebugUnitTest assembleDebug --no-daemon

      - name: Migration schema and GPX regressions
        run: |
          python3 tools/check_planning_migration.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punla-test-results
          path: app/build/reports/tests/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: punla-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  android-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android rendering and UI interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash tools/run_android_ui_checks.sh
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punla-android-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/ui-qa/
            app/build/outputs/connected_android_test_additional_output/
